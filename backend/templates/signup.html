<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 - CREDIT PULSE</title>
  {% include "_favicon.html" %}
  <link rel="stylesheet" href="{{ url_for('static', path='fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='login.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='signup.css') }}">
</head>
<body class="glass-page ui-sans">
  {% include "_page_bg.html" %}
  <main class="signup-main">
    <div class="signup-card">
      <div class="dialog-body">
        <div class="dialog-head">
          <h2>회원가입</h2>
        </div>

        <p id="signup-error" role="alert" hidden></p>
        <p id="signup-status" role="status" hidden></p>

        <form id="signup-form">
          <label for="email">이메일</label>
          <div class="field-row">
            <input type="email" id="email" required autocomplete="email" placeholder="name@gmail.com">
            <button type="button" id="send-code">코드 발송</button>
          </div>

          <label for="verification-code">인증코드</label>
          <input type="text" id="verification-code" required inputmode="numeric" maxlength="6" autocomplete="one-time-code">

          <label for="display-name">닉네임</label>
          <input type="text" id="display-name" name="display_name" required autocomplete="nickname" placeholder="1~50자">

          <label for="password">비밀번호</label>
          <input type="password" id="password" required autocomplete="new-password" aria-describedby="password-length-hint">

          <label for="password-confirm">비밀번호 확인</label>
          <input type="password" id="password-confirm" required autocomplete="new-password" aria-describedby="password-length-hint">
          <p id="password-length-hint" class="password-hint">비밀번호는 영문·숫자만 쓰면 최대 72자, 한글만 쓰면 최대 24자입니다.</p>

          <button type="submit" id="signup-submit">회원가입 완료</button>

          <a class="signup-back" href="/">로그인으로 돌아가기</a>
        </form>
      </div>
    </div>
  </main>

  <script type="module" src="{{ url_for('static', path='signup.js') }}"></script>
</body>
</html>
