{% macro sort_menu(sort_id) -%}
<div class="cs-sort">
  <button id="{{ sort_id }}" class="cs-sort-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="{{ sort_id }}-menu" aria-label="정렬: 최신순"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h7M4 10h5M4 14h3"/><path d="M15 5v10M12.5 12.5 15 15l2.5-2.5"/></svg><span id="{{ sort_id }}-label">최신순</span><svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 5 5 5-5"/></svg></button>
  <ul id="{{ sort_id }}-menu" class="cs-sort-menu" role="listbox" aria-label="정렬 기준" hidden>
    {% for key, label in [("recent", "최신순"), ("oldest", "오래된순"), ("name", "가나다순")] %}
    <li role="presentation"><button type="button" role="option" aria-selected="{{ loop.first | lower }}" data-sort="{{ key }}">{{ label }}<span class="cs-check" aria-hidden="true"><svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 10.5 3.2 3.2L15.5 6"/></svg></span></button></li>
    {% endfor %}
  </ul>
</div>
{%- endmacro %}
