# PR마다 테스트를 돌립니다. 동결한 평가셋이 바뀌면 여기서 실패합니다.
# Actions 무료 한도가 있으니 무거운 평가 전체가 아니라 샘플만 돌리세요.
name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python scripts/sync_landing_companies.py --check
      - run: python -m pytest -q
      # 평가 회귀(D8): 저장된 평가 결과가 기준값(evals/regression_baseline.json)에 못 미치면 실패한다.
      # 위 pytest에 이미 들어 있지만, 어느 단계에서 깨졌는지 보이게 따로 한 번 더 돌린다(유료 API 호출 없음).
      - name: 평가 회귀 검사
        run: python -m pytest -q tests/test_eval_regression.py
      # 화면(JavaScript) 테스트. pytest만으로는 tests/*.test.mjs가 실행되지 않는다.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.mjs
