# G2: `docker compose up` 한 줄로 전체 서비스가 10분 안에 떠야 합니다.
# 평가자에게는 API 키가 없으므로 기본값은 데모 모드(DEMO_MODE=1)입니다.
# 로컬 HTTP 데모용 compose입니다. 운영 TLS 환경에서는 COOKIE_SECURE=1로 설정하세요.
services:
  # 일회성: data/snapshot/을 검증해 DB에 넣고, 심사 그래프 표(체크포인터·Store·비용)와 데모 계정 2개를 만들고 끝납니다.
  # 이미 있으면 건너뜁니다. 실패하면 api가 뜨지 않습니다(빈 DB로 뜨면 /health만 200이라 실패가 숨습니다).
  # 데모 계정 비밀번호는 처음 실행 로그에만 나옵니다: docker compose logs loader
  loader:
    build: .
    command:
      - sh
      - -c
      - |
        set -e
        python -m backend.rag.snapshot --dir data/snapshot
        python scripts/setup_graph_tables.py
        python scripts/compose_demo_users.py
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      DATABASE_URL_DIRECT: postgresql://app:app@db:5432/app
      EMBED_DIM: ${EMBED_DIM:-1536}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    # AUTH_SECRET이 비어 있으면 시작할 때 무작위 값을 만듭니다(키 없이 기동, G2).
    # 앱은 AUTH_SECRET 환경변수만 읽습니다. 재시작하면 기존 세션은 무효가 됩니다.
    command:
      - sh
      - -c
      - |
        : "$${AUTH_SECRET:=$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')}"
        export AUTH_SECRET
        exec uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    # .env가 없어도 뜹니다 (키가 필요 없는 데모 모드)
    env_file:
      - path: .env
        required: false
    environment:
      DEMO_MODE: ${DEMO_MODE:-1}
      DATABASE_URL: postgresql://app:app@db:5432/app
      EMBED_DIM: ${EMBED_DIM:-1536}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    depends_on:
      db:
        condition: service_healthy
      loader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    # pgvector 확장이 들어 있는 Postgres. 데모 스냅샷은 loader 서비스가 적재합니다.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP로 확인합니다. 소켓으로 물으면 초기화용 임시 서버에도 통과합니다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
